<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Anomaly Log — MindTwin</title>

<style>
body {
  background: #111;
  color: #eee;
  font-family: system-ui, sans-serif;
  margin: 0;
  padding: 2rem;
}

nav {
  background: #171616;
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-bottom: 1.5rem;
  padding: 1rem 2.5rem;
  border-radius: 12px;
}

nav .title {
  font-weight: 700;
  color: #911212;
  margin-right: auto;
  font-size: 1.1rem;
}

nav a {
  color: #945151;
  text-decoration: none;
  font-weight: 600;
  padding: 0.45rem 0.9rem;
  border-radius: 8px;
  transition: background 0.2s ease, color 0.2s ease;
}

nav a:visited {
  color: #945151;
}

nav a:hover, nav a.active {
  background: rgba(71,132,230,0.788);
  color: #fff;
}

.page {
  max-width: 1200px;
  margin: 0 auto;
}

.events-header {
  margin-bottom: 1.5rem;
}

.events-header h1 {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin: 0 0 0.75rem 0;
}

.events-header .badge {
  background: #dc2626;
  padding: 0.25rem 0.6rem;
  border-radius: 6px;
  font-size: 0.8rem;
  font-weight: 700;
  color: #fff;
}

#status {
  margin-bottom: 0.75rem;
  color: #ccc;
  font-size: 0.9rem;
}

.filters {
  display: flex;
  gap: 0.75rem;
  margin: 1rem 0;
  flex-wrap: wrap;
  align-items: center;
}

select {
  background: #1b1b1b;
  color: #eee;
  border: 1px solid #333;
  padding: 0.4rem 0.6rem;
  border-radius: 6px;
}

/* Method filter tabs */
.method-tabs {
  display: flex;
  gap: 0.5rem;
  margin: 0.75rem 0 1rem 0;
  flex-wrap: wrap;
}

.method-tab {
  padding: 0.45rem 1.1rem;
  border-radius: 8px;
  border: 1px solid #333;
  background: #1b1b1b;
  color: #aaa;
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s;
}

.method-tab:hover {
  border-color: #555;
  color: #eee;
}

.method-tab.active {
  background: #911212;
  border-color: #911212;
  color: #fff;
}

.method-tab.active.pca-tab    { background: #1d4ed8; border-color: #1d4ed8; }
.method-tab.active.ae-tab     { background: #7c3aed; border-color: #7c3aed; }
.method-tab.active.comb-tab   { background: #be185d; border-color: #be185d; }
.method-tab.active.rf-tab     { background: #f59e0b; border-color: #f59e0b; }
.method-tab.active.all-tab    { background: #374151; border-color: #6b7280; }

#counter {
  margin: 0.5rem 0 1rem 0;
  color: #f87171;
  font-weight: 600;
}

/* Live toggle */
.live-toggle {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-left: auto;
}
.live-label {
  font-size: 0.88rem;
  color: #aaa;
  font-weight: 600;
}
.switch {
  position: relative;
  display: inline-block;
  width: 44px;
  height: 24px;
}
.switch input { display: none; }
.slider-toggle {
  position: absolute;
  inset: 0;
  background: #333;
  border-radius: 24px;
  cursor: pointer;
  transition: 0.3s;
}
.slider-toggle::before {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  left: 3px;
  bottom: 3px;
  background: #fff;
  border-radius: 50%;
  transition: 0.3s;
}
input:checked + .slider-toggle { background: #911212; }
input:checked + .slider-toggle::before { transform: translateX(20px); }

.live-indicator {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  font-size: 0.82rem;
  color: #ef4444;
  font-weight: 700;
  opacity: 0;
  transition: opacity 0.3s;
}
.live-indicator.on { opacity: 1; }
.live-dot {
  width: 7px;
  height: 7px;
  background: #ef4444;
  border-radius: 50%;
  animation: pulse 1.2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.75); }
}

/* Event cards */
.events-list .event {
  border-left: 5px solid #555;
  padding: 0.9rem 1.1rem;
  margin-bottom: 0.9rem;
  background: #181818;
  border-radius: 12px;
  transition: box-shadow 0.2s;
}

.events-list .event:hover {
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
}

.events-list .event.CRITICAL { border-color: #ff3b3b; }
.events-list .event.WARNING  { border-color: #f59e0b; }

/* PCA events */
.events-list .event.PCA {
  border-color: #3b82f6;
  background: rgba(59, 130, 246, 0.05);
}

/* Autoencoder events */
.events-list .event.AUTOENCODER {
  border-color: #a855f7;
  background: rgba(168, 85, 247, 0.05);
}

/* Combined events */
.events-list .event.COMBINED {
  border-color: #ec4899;
  background: rgba(236, 72, 153, 0.08);
  box-shadow: 0 0 10px rgba(236, 72, 153, 0.18);
}

/* Random Forest events */
.events-list .event.RF {
  border-color: #f59e0b;
  background: rgba(245, 158, 11, 0.06);
}

/* Old live-mode event types */
.events-list .event.TRIPLE_THREAT {
  border-color: #ff4500;
  background: rgba(255, 69, 0, 0.10);
  box-shadow: 0 0 16px rgba(255, 69, 0, 0.35);
  animation: triple-pulse 1.2s ease-in-out infinite alternate;
}

@keyframes triple-pulse {
  from { box-shadow: 0 0 8px rgba(255, 69, 0, 0.35); }
  to   { box-shadow: 0 0 22px rgba(255, 69, 0, 0.7); }
}

.events-list .meta {
  font-size: 0.9rem;
  color: #aaa;
  margin-top: 0.45rem;
  line-height: 1.35;
}

/* Method badge chips */
.chip {
  display: inline-block;
  padding: 0.15rem 0.5rem;
  border-radius: 5px;
  font-size: 0.74rem;
  font-weight: 700;
  margin-right: 0.35rem;
  vertical-align: middle;
  letter-spacing: 0.02em;
}
.chip.pca    { background: #1d4ed8; color: #fff; }
.chip.ae     { background: #7c3aed; color: #fff; }
.chip.comb   { background: #be185d; color: #fff; }
.chip.rf     { background: #f59e0b; color: #111; }
.chip.live-chip { background: #374151; color: #d1d5db; }

/* Info section on mode switch */
.mode-info {
  padding: 0.6rem 1rem;
  background: rgba(255,255,255,0.04);
  border: 1px solid #2d2d2d;
  border-radius: 10px;
  font-size: 0.85rem;
  color: #9ca3af;
  margin-bottom: 0.75rem;
}
</style>
</head>

<body>

<nav>
  <div class="title">MindTwin</div>
  <a href="/">Home</a>
  <a href="/thermal">Thermal</a>
  <a href="/torque">Torque</a>
  <a href="/events">Events</a>
  <a href="/autoencoder">Autoencoder</a>
  <a href="/pca">PCA</a>
  <a href="/rf">Random Forest</a>
</nav>

<div class="page">
  <header class="events-header">
    <h1>
      Anomaly Log
      <span id="criticalCount"></span>
    </h1>

    <div id="status">Waiting for events…</div>

    <div class="filters">
      <select id="timeFilter">
        <option value="all">All anomalies</option>
        <option value="5">Last 5 minutes</option>
      </select>

      <div class="live-toggle">
        <span class="live-label">Live Mode</span>
        <label class="switch">
          <input type="checkbox" id="liveModeToggle" checked />
          <span class="slider-toggle"></span>
        </label>
        <span class="live-indicator" id="liveIndicator">
          <span class="live-dot"></span> LIVE
        </span>
      </div>
    </div>

    <!-- Method filter tabs — visible in both modes but behavior differs -->
    <div class="method-tabs" id="methodTabs">
      <button class="method-tab all-tab active" data-method="all" id="tab-all">All</button>
      <button class="method-tab pca-tab" data-method="PCA" id="tab-pca">PCA</button>
      <button class="method-tab ae-tab" data-method="Autoencoder" id="tab-ae">Autoencoder</button>
      <button class="method-tab rf-tab" data-method="RandomForest" id="tab-rf">Random Forest</button>
      <button class="method-tab comb-tab" data-method="Combined" id="tab-combined">Combined</button>
    </div>

    <div id="modeInfo" class="mode-info" style="display:none;"></div>

    <div id="counter"></div>
  </header>

  <section class="events-list">
    <div id="events"></div>
  </section>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   HELPER UTILITIES
═══════════════════════════════════════════════════════════════════ */

/**
 * Extract HH:mm:ss from various timestamp formats:
 * "2025-11-27 14:43:59.692" → "14:43:59"
 * "14:43:59.692"            → "14:43:59"
 * "2026-05-25T14:43:59.692Z"→ "14:43:59"
 */
function extractSecond(ts) {
  if (!ts) return null;
  const s = String(ts);
  // Try HH:mm:ss pattern directly
  const m = s.match(/(\d{2}:\d{2}:\d{2})/);
  if (m) return m[1];
  // Try Date parse
  try {
    const d = new Date(s);
    if (!isNaN(d)) {
      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');
      const ss = String(d.getSeconds()).padStart(2,'0');
      return `${hh}:${mm}:${ss}`;
    }
  } catch(_) {}
  return null;
}

/**
 * Safe extractor: pulls the anomaly array from various JSON shapes.
 */
function extractAnomalyArray(json) {
  if (Array.isArray(json)) return json;
  if (Array.isArray(json.anomalies)) return json.anomalies;
  if (Array.isArray(json.single_feature_anomalies)) return json.single_feature_anomalies;
  if (Array.isArray(json.pca_anomalies)) return json.pca_anomalies;
  if (Array.isArray(json.results)) return json.results;
  return [];
}

function num4(x) { return (typeof x === 'number') ? x.toFixed(4) : '-'; }
function num2(x) { return (typeof x === 'number') ? x.toFixed(2) : '-'; }

function fmtTime(iso) {
  if (!iso) return 'N/A';
  const sec = extractSecond(iso);
  if (sec) return sec;
  return iso.replace('T',' ').split('.')[0];
}

const KELVIN_OFFSET = 273.15;
function toCelsius(v) {
  return (typeof v === 'number' && v > 120) ? (v - KELVIN_OFFSET) : v;
}

/* ═══════════════════════════════════════════════════════════════════
   NORMALIZERS  (static/result-file mode)
═══════════════════════════════════════════════════════════════════ */

function normalizePcaAnomaly(raw) {
  const index = raw.frame_no ?? raw.frame ?? raw.frame_index ?? raw.index ?? raw.row_index ?? null;
  const timestamp =
    raw.timestamp ?? raw.time ?? raw.DateTime ?? raw.datetime ?? null;

  const ts = timestamp;
  const secondKey = extractSecond(ts);

  const feature =
    raw.feature ?? raw.feature_name ?? raw.dominant_feature ?? raw.sensor ?? null;

  return {
    method: 'PCA',
    feature: feature || 'Unknown',
    frame: index,
    timestamp: ts || 'N/A',
    secondKey,
    score: raw.pca_score ?? raw.score ?? raw.error ?? raw.distance ?? null,
    featureError: raw.feature_error ?? null,
    threshold: raw.pca_threshold ?? raw.threshold ?? raw.threshold_distance ?? raw.fixed_threshold ?? null,
    featThreshold: raw.feat_threshold ?? null,
    severityRatio: raw.severityRatio ?? raw.severity_ratio ?? raw.severity ?? null,
    direction: raw.direction ?? null,
    explanation: raw.explanation ?? null,
    raw
  };
}

function normalizeAutoencoderAnomaly(raw) {
  const index = raw.frame_no ?? raw.frame ?? raw.frame_index ?? raw.index ?? raw.row_index ?? null;
  const timestamp =
    raw.timestamp ?? raw.time ?? raw.DateTime ?? raw.datetime ?? null;

  const ts = timestamp;
  const secondKey = extractSecond(ts);

  const feature =
    raw.feature ?? raw.feature_name ?? raw.dominant_feature ?? raw.sensor ?? null;

  return {
    method: 'Autoencoder',
    feature: feature || 'Unknown',
    frame: index,
    timestamp: ts || 'N/A',
    secondKey,
    score: raw.error ?? raw.reconstruction_error ?? raw.score ?? raw.distance ?? null,
    threshold: raw.threshold ?? raw.fixed_threshold ?? raw.threshold_distance ?? null,
    severityRatio: raw.severity_ratio ?? raw.severityRatio ?? raw.severity ?? null,
    direction: raw.direction ?? null,
    explanation: raw.explanation ?? null,
    raw
  };
}

function normalizeRfAnomaly(raw, featureHint) {
  // raw is an overall row from rf_results.json with is_anomaly=true
  const index = raw.frame_no ?? raw.frame ?? null;
  const timestamp = raw.timestamp ?? raw.time ?? null;
  const ts = timestamp;
  const secondKey = extractSecond(ts);

  // Feature: use worst_joint (1-based int → "TORQUE_A{n}")
  let feature = featureHint || null;
  if (!feature) {
    const wj = raw.worst_joint;
    if (wj != null) feature = `TORQUE_A${wj}`;
  }

  const score = raw.max_residual ?? raw.score ?? null;
  const threshold = raw.threshold ?? null;
  const severityRatio = (score != null && threshold != null && threshold > 0)
    ? score / threshold
    : (raw.severity_ratio ?? null);

  return {
    method: 'RandomForest',
    feature: feature || 'Unknown',
    frame: index,
    timestamp: ts || 'N/A',
    secondKey,
    score,
    threshold,
    severityRatio,
    worstJoint: raw.worst_joint ?? null,
    anomalyJoints: raw.anomaly_joints ?? [],
    explanation: raw.explanation ?? null,
    raw
  };
}

/**
 * Build Combined list: same HH:mm:ss AND same feature, across PCA+AE+RF.
 * Returns combined entries where at least 2 models agree.
 */
function createCombinedAnomalies(pcaList, aeList, rfList) {
  rfList = rfList || [];
  const combined = [];
  // Build lookup maps keyed by secondKey|feature
  const pcaMap = {};
  for (const a of pcaList) {
    if (!a.secondKey || !a.feature || a.feature === 'Unknown') continue;
    const k = `${a.secondKey}|${a.feature}`;
    pcaMap[k] = a;
  }
  const aeMap = {};
  for (const a of aeList) {
    if (!a.secondKey || !a.feature || a.feature === 'Unknown') continue;
    const k = `${a.secondKey}|${a.feature}`;
    aeMap[k] = a;
  }
  const rfMap = {};
  for (const a of rfList) {
    if (!a.secondKey || !a.feature || a.feature === 'Unknown') continue;
    const k = `${a.secondKey}|${a.feature}`;
    rfMap[k] = a;
  }

  // Collect all unique keys
  const allKeys = new Set([
    ...Object.keys(pcaMap),
    ...Object.keys(aeMap),
    ...Object.keys(rfMap)
  ]);

  for (const key of allKeys) {
    const hasPca = !!pcaMap[key];
    const hasAe  = !!aeMap[key];
    const hasRf  = !!rfMap[key];
    const count  = (hasPca ? 1 : 0) + (hasAe ? 1 : 0) + (hasRf ? 1 : 0);
    if (count < 2) continue;

    const [secondKey, feature] = key.split('|');
    const pFrame = pcaMap[key] ? pcaMap[key].frame : null;
    const aFrame = aeMap[key] ? aeMap[key].frame : null;
    const rFrame = rfMap[key] ? rfMap[key].frame : null;
    const maxFrame = Math.max(pFrame || 0, aFrame || 0, rFrame || 0);

    combined.push({
      type: count === 3 ? 'TripleCombined' : 'Combined',
      time: secondKey,
      feature,
      frame: maxFrame || null,
      pcaAnomaly: pcaMap[key] || null,
      autoencoderAnomaly: aeMap[key] || null,
      rfAnomaly: rfMap[key] || null,
      pcaScore: pcaMap[key] ? pcaMap[key].score : null,
      autoencoderScore: aeMap[key] ? aeMap[key].score : null,
      rfScore: rfMap[key] ? rfMap[key].score : null,
      matchReason: `${count}-model agreement at same second+feature`
    });
  }
  return combined;
}

/* ═══════════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════════ */
const eventsDiv     = document.getElementById('events');
const statusDiv     = document.getElementById('status');
const criticalBadge = document.getElementById('criticalCount');
const liveModeToggle= document.getElementById('liveModeToggle');
const liveIndicator = document.getElementById('liveIndicator');
const counterDiv    = document.getElementById('counter');
const modeInfoDiv   = document.getElementById('modeInfo');

let liveMode    = true;
let pollTimer   = null;
let cachedEvents= [];   // live mode: all events from /errors

// Static mode data
let staticPcaAnomalies  = [];   // normalized PCA anomalies
let staticAeAnomalies   = [];   // normalized AE anomalies
let staticRfAnomalies   = [];   // normalized RF anomalies
let staticCombined      = [];   // derived combined

let activeMethod = 'all';   // 'all' | 'PCA' | 'Autoencoder' | 'Combined' | 'RandomForest'

/* ═══════════════════════════════════════════════════════════════════
   LIVE MODE — render from /errors
═══════════════════════════════════════════════════════════════════ */

function fmtMetaLive(type, meta = {}) {
  if (type === 'THERMAL') {
    const tmaxC = toCelsius(meta.t_max);
    const thrC  = toCelsius(meta.threshold);
    return `Tmax=${num2(tmaxC)}°C (thr=${num2(thrC)}°C) | Frame ${meta.frame_no}`;
  }
  if (type === 'TORQUE') {
    return `Joint ${meta.joint} | Δ=${num2(meta.diff)} (thr=${meta.threshold}) | Frame ${meta.frame_no}`;
  }
  if (type === 'TORQUE_PCA') {
    return `Score: ${num4(meta.score)} (thr: ${num4(meta.threshold)}) | Joint: A${meta.worst_joint || '?'} | Frame: ${meta.frame_no}`;
  }
  if (type === 'TORQUE_AUTOENCODER') {
    return `Score: ${num4(meta.score)} (thr: ${num4(meta.threshold)}) | Joint: A${meta.worst_joint || '?'} | Frame: ${meta.frame_no}`;
  }
  if (type === 'TORQUE_COMBINED') {
    const modelsList = Array.isArray(meta.models) ? meta.models : ['PCA', 'AE'];
    const chips = modelsList.map(m => {
      const cls = m === 'PCA' ? 'pca' : m === 'AE' ? 'ae' : m === 'RF' ? 'rf' : 'live-chip';
      return `<span class="chip ${cls}" style="margin-top:0.35rem">${m}</span>`;
    }).join(' ');
    return `
      ${chips} | Joint: A${meta.worst_joint || '?'} | Frame: ${meta.frame_no}
      <br>
      ${meta.pca_score != null ? `<span class="chip pca">PCA</span> Score: ${num4(meta.pca_score)} &nbsp;` : ''}
      ${meta.ae_score != null  ? `<span class="chip ae">AE</span> Score: ${num4(meta.ae_score)} &nbsp;`   : ''}
      ${meta.rf_max_residual != null ? `<span class="chip rf">RF</span> Residual: ${num4(meta.rf_max_residual)}` : ''}
    `;
  }
  if (type === 'TORQUE_TRIPLE_COMBINED') {
    const modelsList = Array.isArray(meta.models) ? meta.models.join(' + ') : 'PCA + AE + RF';
    return `
      ⚡ Triple: ${modelsList} | Joint: A${meta.worst_joint || '?'} | Frame: ${meta.frame_no}
      <br>
      ${meta.pca_score != null ? `<span class="chip pca">PCA</span> Score: ${num4(meta.pca_score)} &nbsp;` : ''}
      ${meta.ae_score != null  ? `<span class="chip ae">AE</span> Score: ${num4(meta.ae_score)} &nbsp;`   : ''}
      ${meta.rf_max_residual != null ? `<span class="chip rf">RF</span> Residual: ${num4(meta.rf_max_residual)}` : ''}
    `;
  }
  if (type === 'TORQUE_TRIPLE_THREAT') {
    const models = Array.isArray(meta.models) ? meta.models.join(' | ') : '-';
    return `⚡ Joint ${meta.worst_joint} Δ=${num2(meta.max_diff)} (thr=${meta.torque_thr}) | Active Models: ${models} | Frame ${meta.frame_no}`;
  }
  if (type === 'TORQUE_RF') {
    const joints = Array.isArray(meta.anomaly_joints) ? meta.anomaly_joints.map(j => `A${j}`).join(', ') : '-';
    return `Residual: ${num4(meta.score)} (thr: ${num4(meta.threshold)}) | Joint: A${meta.worst_joint || '?'} | Frame: ${meta.frame_no}` +
      (joints && joints !== '-' ? `<br>Anomaly joints: ${joints}` : '');
  }
  return JSON.stringify(meta);
}

function renderLiveEvents(data) {
  const timeFilter = document.getElementById('timeFilter').value;
  const method     = activeMethod;  // 'all'|'PCA'|'Autoencoder'|'Combined'

  let now = Date.now();
  if (data.length > 0) {
    let maxTime = 0;
    data.forEach(e => {
      if (e.timestamp) {
        const t = new Date(e.timestamp.replace(' ','T')).getTime();
        if (t > maxTime) maxTime = t;
      }
    });
    if (maxTime > 0) now = maxTime;
  }

  // Map method filter to event types for live mode
  const methodTypeMap = {
    'PCA'        : ['TORQUE_PCA'],
    'Autoencoder': ['TORQUE_AUTOENCODER'],
    'Combined'   : ['TORQUE_COMBINED', 'TORQUE_TRIPLE_COMBINED', 'TORQUE_TRIPLE_THREAT'],
    'RandomForest': ['TORQUE_RF'],
    'all'        : null   // no filter
  };
  const allowedTypes = methodTypeMap[method];

  let html = '';
  let criticalCount = 0;

  data.slice().reverse().forEach(e => {
    if (e.severity === 'INFO') return;

    if (allowedTypes && !allowedTypes.includes(e.type)) return;

    if (timeFilter === '5' && e.timestamp) {
      const t = new Date(e.timestamp.replace(' ','T')).getTime();
      if (now - t > 5 * 60 * 1000) return;
    }

    if (e.severity === 'CRITICAL') criticalCount++;

    let extraClass = e.severity || 'WARNING';
    if (e.type === 'TORQUE_PCA')              extraClass = 'PCA';
    if (e.type === 'TORQUE_AUTOENCODER')      extraClass = 'AUTOENCODER';
    if (e.type === 'TORQUE_COMBINED')         extraClass = 'COMBINED';
    if (e.type === 'TORQUE_TRIPLE_COMBINED')  extraClass = 'COMBINED';
    if (e.type === 'TORQUE_RF')               extraClass = 'RF';
    if (e.type === 'TORQUE_TRIPLE_THREAT')    extraClass = 'TRIPLE_THREAT';

    let sevBadge = '';
    if (e.severity === 'CRITICAL') {
      sevBadge = `<span style="background:#dc2626;color:white;padding:2px 6px;border-radius:4px;font-size:0.75rem;font-weight:bold;margin-left:0.5rem;display:inline-block;vertical-align:middle;">CRITICAL</span>`;
    } else if (e.severity === 'WARNING') {
      sevBadge = `<span style="background:#d97706;color:white;padding:2px 6px;border-radius:4px;font-size:0.75rem;font-weight:bold;margin-left:0.5rem;display:inline-block;vertical-align:middle;">WARNING</span>`;
    }

    let typeChip = `<span class="chip live-chip">${e.type}</span>`;
    if (e.type === 'TORQUE_PCA')              typeChip = `<span class="chip pca">PCA</span>`;
    if (e.type === 'TORQUE_AUTOENCODER')      typeChip = `<span class="chip ae">AE</span>`;
    if (e.type === 'TORQUE_COMBINED')         typeChip = `<span class="chip comb">COMBINED</span>`;
    if (e.type === 'TORQUE_TRIPLE_COMBINED')  typeChip = `<span class="chip comb">TRIPLE</span>`;
    if (e.type === 'TORQUE_RF')               typeChip = `<span class="chip rf">RF</span>`;

    html += `
      <div class="event ${extraClass}">
        <strong>[${fmtTime(e.timestamp)}]</strong>
        ${typeChip}
        ${sevBadge}
        <span style="color:#ddd; margin-left:0.35rem">${e.message}</span>
        <div class="meta">${fmtMetaLive(e.type, e.meta)}</div>
      </div>
    `;
  });

  eventsDiv.innerHTML = html || `<div class="meta">No events matching filters.</div>`;

  // Count display
  const shown = (html.match(/class="event/g) || []).length;
  counterDiv.textContent = shown > 0 ? `Showing ${shown} events` : '';

  criticalBadge.innerHTML =
    criticalCount > 0 ? `<span class="badge">${criticalCount} CRITICAL</span>` : '';
}

/* ═══════════════════════════════════════════════════════════════════
   STATIC MODE — render from result files
═══════════════════════════════════════════════════════════════════ */

/* Sort anomaly array by frame number descending (highest first) */
function sortByFrameDesc(arr) {
  return arr.slice().sort((a, b) => {
    const fa = a.frame ?? 0;
    const fb = b.frame ?? 0;
    return fb - fa;
  });
}

/* Sort combined list by frame number descending */
function sortCombinedDesc(arr) {
  return arr.slice().sort((a, b) => {
    const fa = a.frame ?? 0;
    const fb = b.frame ?? 0;
    return fb - fa;
  });
}

function renderStaticEvents() {
  const method = activeMethod;

  let items = 0;
  let html  = '';

  if (method === 'all') {
    statusDiv.textContent = `Results loaded — PCA: ${staticPcaAnomalies.length} | AE: ${staticAeAnomalies.length} | RF: ${staticRfAnomalies.length} | Combined: ${staticCombined.length}`;
    // Merge PCA + AE + RF into one unified sorted list (highest frame first)
    const merged = [
      ...staticPcaAnomalies.map(a => ({ _frame: a.frame ?? 0, card: buildPcaCard(a) })),
      ...staticAeAnomalies.map(a  => ({ _frame: a.frame ?? 0, card: buildAeCard(a) })),
      ...staticRfAnomalies.map(a  => ({ _frame: a.frame ?? 0, card: buildRfCard(a) })),
    ].sort((a, b) => b._frame - a._frame);

    const combSorted = sortCombinedDesc(staticCombined);

    html = merged.map(x => x.card).join('') + (combSorted.length ? '<div style="margin-top:1.5rem;border-top:1px solid #2d2d2d;padding-top:1rem;color:#6b7280;font-size:0.8rem;margin-bottom:0.75rem;">── Combined Anomalies (same second + same feature, 2+ models) ──</div>' + combSorted.map(c => buildCombinedCard(c)).join('') : '');
    items = merged.length + combSorted.length;

  } else if (method === 'PCA') {
    statusDiv.textContent = `Results loaded — PCA Only: ${staticPcaAnomalies.length} anomalies`;
    const sorted = sortByFrameDesc(staticPcaAnomalies);
    html  = sorted.map(a => buildPcaCard(a)).join('');
    items = sorted.length;

  } else if (method === 'Autoencoder') {
    statusDiv.textContent = `Results loaded — Autoencoder Only: ${staticAeAnomalies.length} anomalies`;
    const sorted = sortByFrameDesc(staticAeAnomalies);
    html  = sorted.map(a => buildAeCard(a)).join('');
    items = sorted.length;

  } else if (method === 'RandomForest') {
    statusDiv.textContent = `Results loaded — Random Forest: ${staticRfAnomalies.length} anomalies`;
    const sorted = sortByFrameDesc(staticRfAnomalies);
    html  = sorted.map(a => buildRfCard(a)).join('');
    items = sorted.length;

  } else if (method === 'Combined') {
    statusDiv.textContent = `Results loaded — Combined (2+ models): ${staticCombined.length} matches`;
    const sorted = sortCombinedDesc(staticCombined);
    html  = sorted.map(c => buildCombinedCard(c)).join('');
    items = sorted.length;
  }

  eventsDiv.innerHTML = html || `<div class="meta">No anomalies matching the filter.</div>`;

  counterDiv.textContent = items > 0 ? `Showing ${items} records` : '';
  criticalBadge.innerHTML = '';
}

function sev(ratio) {
  if (!ratio) return 'WARNING';
  return ratio >= 1.4 ? 'CRITICAL' : 'WARNING';
}

function buildPcaCard(a) {
  const cls = sev(a.severityRatio);
  const scoreStr   = a.score        != null ? num4(a.score)         : 'N/A';
  const thrStr     = a.threshold    != null ? num4(a.threshold)     : 'N/A';
  const ratioStr   = a.severityRatio!= null ? num2(a.severityRatio) : 'N/A';
  const jointStr   = a.feature ? a.feature.replace('TORQUE_', '') : '?';
  const frameStr   = a.frame        != null ? ` | Frame: ${a.frame}`: '';

  return `
    <div class="event PCA">
      <strong>[${fmtTime(a.timestamp)}]</strong>
      <span class="chip pca">PCA</span>
      <span class="badge ${cls}" style="background:${cls === 'CRITICAL' ? '#dc2626' : '#d97706'};color:white;padding:2px 6px;border-radius:4px;font-size:0.75rem;font-weight:bold;margin-left:0.5rem;display:inline-block;vertical-align:middle;">${cls}</span>
      <span style="color:#ddd;margin-left:0.35rem">PCA Torque Error: ${jointStr}</span>
      <div class="meta">
        Score: ${scoreStr} (thr: ${thrStr}) | Joint: ${jointStr}${frameStr}
        ${a.severityRatio ? ` | Severity: ${ratioStr}×` : ''}
        ${a.explanation ? `<br><span style="color:#6b7280">${a.explanation}</span>` : ''}
      </div>
    </div>`;
}

function buildAeCard(a) {
  const cls = sev(a.severityRatio);
  const scoreStr = a.score      != null ? num4(a.score)         : 'N/A';
  const thrStr   = a.threshold  != null ? num4(a.threshold)     : 'N/A';
  const ratioStr = a.severityRatio != null ? num2(a.severityRatio) : 'N/A';
  const jointStr = a.feature ? a.feature.replace('TORQUE_', '') : '?';
  const frameStr = a.frame      != null ? ` | Frame: ${a.frame}`: '';

  return `
    <div class="event AUTOENCODER">
      <strong>[${fmtTime(a.timestamp)}]</strong>
      <span class="chip ae">AE</span>
      <span class="badge ${cls}" style="background:${cls === 'CRITICAL' ? '#dc2626' : '#d97706'};color:white;padding:2px 6px;border-radius:4px;font-size:0.75rem;font-weight:bold;margin-left:0.5rem;display:inline-block;vertical-align:middle;">${cls}</span>
      <span style="color:#ddd;margin-left:0.35rem">Autoencoder Torque Error: ${jointStr}</span>
      <div class="meta">
        Score: ${scoreStr} (thr: ${thrStr}) | Joint: ${jointStr}${frameStr}
        ${a.severityRatio ? ` | Severity: ${ratioStr}×` : ''}
        ${a.explanation ? `<br><span style="color:#6b7280">${a.explanation}</span>` : ''}
      </div>
    </div>`;
}

function buildRfCard(a) {
  const cls = sev(a.severityRatio);
  const scoreStr = a.score     != null ? num4(a.score)         : 'N/A';
  const thrStr   = a.threshold != null ? num4(a.threshold)     : 'N/A';
  const ratioStr = a.severityRatio != null ? num2(a.severityRatio) : 'N/A';
  const jointStr = a.feature ? a.feature.replace('TORQUE_', '') : '?';
  const frameStr = a.frame   != null ? ` | Frame: ${a.frame}` : '';

  return `
    <div class="event RF">
      <strong>[${fmtTime(a.timestamp)}]</strong>
      <span class="chip rf">RF</span>
      <span class="badge ${cls}" style="background:${cls === 'CRITICAL' ? '#dc2626' : '#d97706'};color:white;padding:2px 6px;border-radius:4px;font-size:0.75rem;font-weight:bold;margin-left:0.5rem;display:inline-block;vertical-align:middle;">${cls}</span>
      <span style="color:#ddd;margin-left:0.35rem">Random Forest Residual: ${jointStr}</span>
      <div class="meta">
        Residual: ${scoreStr} (thr: ${thrStr}) | Joint: ${jointStr}${frameStr}
        ${a.severityRatio ? ` | Severity: ${ratioStr}×` : ''}
        ${a.explanation ? `<br><span style="color:#6b7280">${a.explanation}</span>` : ''}
      </div>
    </div>`;
}

function buildCombinedCard(c) {
  const pca = c.pcaAnomaly;
  const ae  = c.autoencoderAnomaly;
  const rf  = c.rfAnomaly;
  const jointStr = c.feature ? c.feature.replace('TORQUE_', '') : '?';
  const isTriple = c.type === 'TripleCombined';
  const label = isTriple ? 'TRIPLE ANOMALY (PCA + AE + RF)' : 'COMBINED ANOMALY';

  return `
    <div class="event COMBINED">
      <strong>[${c.time}]</strong>
      <span class="chip comb">${isTriple ? 'TRIPLE' : 'COMBINED'}</span>
      <span class="badge CRITICAL" style="background:#dc2626;color:white;padding:2px 6px;border-radius:4px;font-size:0.75rem;font-weight:bold;margin-left:0.5rem;display:inline-block;vertical-align:middle;">CRITICAL</span>
      <span style="color:#ddd;margin-left:0.35rem">${label}: ${jointStr}</span>
      <div class="meta">
        Joint: ${jointStr} | Time: ${c.time}
        ${pca ? `<br><span class="chip pca" style="margin-top:0.35rem">PCA</span> Score: ${c.pcaScore != null ? num4(c.pcaScore) : 'N/A'}${pca.threshold ? ` (thr: ${num4(pca.threshold)})` : ''}${pca.severityRatio ? ` | Severity: ${num2(pca.severityRatio)}×` : ''}` : ''}
        ${ae  ? `<br><span class="chip ae" style="margin-top:0.2rem">AE</span> Score: ${c.autoencoderScore != null ? num4(c.autoencoderScore) : 'N/A'}${ae.threshold ? ` (thr: ${num4(ae.threshold)})` : ''}${ae.severityRatio ? ` | Severity: ${num2(ae.severityRatio)}×` : ''}` : ''}
        ${rf  ? `<br><span class="chip rf" style="margin-top:0.2rem">RF</span> Residual: ${c.rfScore != null ? num4(c.rfScore) : 'N/A'}${rf.threshold ? ` (thr: ${num4(rf.threshold)})` : ''}${rf.severityRatio ? ` | Severity: ${num2(rf.severityRatio)}×` : ''}` : ''}
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════════
   LOAD STATIC RESULTS from API endpoints
═══════════════════════════════════════════════════════════════════ */

async function loadStaticResults() {
  statusDiv.textContent = 'Loading result files…';

  try {
    // 1. Load PCA results
    const pcaRes = await fetch('/api/pca/results', { cache: 'no-store' });
    const pcaJson = pcaRes.ok ? await pcaRes.json() : {};

    const pcaPerFeature = pcaJson.per_feature || {};
    staticPcaAnomalies = [];
    for (const [feat, items] of Object.entries(pcaPerFeature)) {
      if (!feat.startsWith('TORQUE_')) continue;
      const arr = Array.isArray(items) ? items : [];
      for (const raw of arr) {
        if (raw.is_anomaly) {
          staticPcaAnomalies.push(normalizePcaAnomaly(raw));
        }
      }
    }

    // 2. Load Autoencoder results
    const aeRes = await fetch('/api/autoencoder/results', { cache: 'no-store' });
    const aeJson = aeRes.ok ? await aeRes.json() : {};

    // Build time-to-frame mapping from multiple list
    const aeTimeToFrame = {};
    if (Array.isArray(aeJson.multiple)) {
      aeJson.multiple.forEach((row, idx) => {
        if (row.timestamp) aeTimeToFrame[row.timestamp] = idx;
      });
    }

    staticAeAnomalies = [];
    const aeSingle = aeJson.single || {};
    for (const [feat, items] of Object.entries(aeSingle)) {
      if (!feat.startsWith('TORQUE_')) continue;
      const arr = Array.isArray(items) ? items : [];
      for (const raw of arr) {
        if (raw.is_anomaly) {
          const norm = normalizeAutoencoderAnomaly(raw);
          if (norm.frame == null && norm.timestamp) {
            norm.frame = aeTimeToFrame[norm.timestamp] ?? null;
          }
          staticAeAnomalies.push(norm);
        }
      }
    }

    // 3. Load Random Forest results
    const rfRes = await fetch('/api/rf/results', { cache: 'no-store' });
    const rfJson = rfRes.ok ? await rfRes.json() : {};

    staticRfAnomalies = [];
    const rfOverall = rfJson.overall || [];
    for (const raw of rfOverall) {
      if (!raw.is_anomaly) continue;
      // Each RF overall row corresponds to all joints simultaneously;
      // we create one entry per anomaly joint if anomaly_joints available,
      // otherwise fall back to worst_joint.
      const joints = Array.isArray(raw.anomaly_joints) && raw.anomaly_joints.length > 0
        ? raw.anomaly_joints
        : (raw.worst_joint != null ? [raw.worst_joint] : []);
      if (joints.length === 0) {
        staticRfAnomalies.push(normalizeRfAnomaly(raw, null));
      } else {
        for (const j of joints) {
          staticRfAnomalies.push(normalizeRfAnomaly(raw, `TORQUE_A${j}`));
        }
      }
    }
    // Also check per_feature for RF (some formats store per-joint results there)
    const rfPerFeature = rfJson.per_feature || {};
    for (const [feat, items] of Object.entries(rfPerFeature)) {
      if (!feat.startsWith('TORQUE_')) continue;
      const arr = Array.isArray(items) ? items : [];
      for (const raw of arr) {
        if (raw.is_anomaly) {
          // Only add if not already covered from overall
          staticRfAnomalies.push(normalizeRfAnomaly(raw, feat));
        }
      }
    }
    // Deduplicate RF by frame+feature
    const rfSeen = new Set();
    staticRfAnomalies = staticRfAnomalies.filter(a => {
      const k = `${a.frame}|${a.feature}`;
      if (rfSeen.has(k)) return false;
      rfSeen.add(k);
      return true;
    });

    // 4. Build Combined (2+ model agreement)
    staticCombined = createCombinedAnomalies(staticPcaAnomalies, staticAeAnomalies, staticRfAnomalies);

    // 5. Remove combined from standalone arrays to avoid duplicates in 'all' view
    const combinedKeys = new Set(staticCombined.map(c => c.time + '|' + c.feature));
    staticPcaAnomalies = staticPcaAnomalies.filter(a => !combinedKeys.has((a.secondKey || '') + '|' + a.feature));
    staticAeAnomalies  = staticAeAnomalies.filter(a =>  !combinedKeys.has((a.secondKey || '') + '|' + a.feature));
    staticRfAnomalies  = staticRfAnomalies.filter(a =>  !combinedKeys.has((a.secondKey || '') + '|' + a.feature));

    statusDiv.style.color = '#86efac';

    modeInfoDiv.style.display = 'block';
    modeInfoDiv.innerHTML =
      `📊 Static mode: showing pre-computed results. ` +
      `PCA from <code>pca_results.json</code> | ` +
      `AE from <code>autoencoder_results.json</code> | ` +
      `RF from <code>rf_results.json</code>. ` +
      `Combined = same HH:mm:ss + same feature (2+ models).`;

    renderStaticEvents();

  } catch (err) {
    statusDiv.textContent = `Error loading results: ${err.message}`;
    statusDiv.style.color = '#f87171';
    eventsDiv.innerHTML = `<div class="meta">Failed to load result files.</div>`;
  }
}

/* ═══════════════════════════════════════════════════════════════════
   LIVE MODE POLLING
═══════════════════════════════════════════════════════════════════ */

async function fetchEvents() {
  try {
    const res = await fetch('/errors', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // Always keep all events; replace cachedEvents with latest from server
    cachedEvents = data.slice(-500);

    statusDiv.textContent = `Updated: ${new Date().toLocaleTimeString()} — ${cachedEvents.length} event(s) received`;
    statusDiv.style.color = '#ccc';
    renderLiveEvents(cachedEvents);

  } catch (e) {
    statusDiv.textContent = `Cannot load /errors — ${e.message}`;
    statusDiv.style.color = '#f87171';
  }
}

function startPolling() {
  stopPolling();
  fetchEvents();
  pollTimer = setInterval(fetchEvents, 1000);
}

function stopPolling() {
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

/* ═══════════════════════════════════════════════════════════════════
   MODE SWITCHING
═══════════════════════════════════════════════════════════════════ */

function setLiveMode(on, saveToStorage = true, isManualToggle = false) {
  liveMode = on;
  if (saveToStorage) {
    localStorage.setItem('mindtwin_global_live_mode', liveMode);
  }
  
  if (liveModeToggle && liveModeToggle.checked !== on) {
    liveModeToggle.checked = on;
  }
  
  liveIndicator.classList.toggle('on', on);

  const timeFilterSelect = document.getElementById('timeFilter');

  if (on) {
    timeFilterSelect.disabled = true;
    modeInfoDiv.style.display = 'none';
    statusDiv.textContent = 'Live mode — connecting...';
    statusDiv.style.color = '#ccc';

    if (isManualToggle) {
      cachedEvents = [];
      renderLiveEvents(cachedEvents);
    }
    
    startPolling();
  } else {
    stopPolling();
    timeFilterSelect.value = 'all';
    timeFilterSelect.disabled = true;
    modeInfoDiv.style.display = 'none';
    statusDiv.textContent = 'Loading static results…';
    statusDiv.style.color = '#ccc';
    loadStaticResults();
  }
}

/* ═══════════════════════════════════════════════════════════════════
   METHOD TABS
═══════════════════════════════════════════════════════════════════ */

document.querySelectorAll('.method-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.method-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    activeMethod = tab.dataset.method;

    if (liveMode) {
      renderLiveEvents(cachedEvents);
    } else {
      renderStaticEvents();
    }
  });
});

/* ═══════════════════════════════════════════════════════════════════
   EVENTS
═══════════════════════════════════════════════════════════════════ */

liveModeToggle.addEventListener('change', () => {
  setLiveMode(liveModeToggle.checked, true, true);
});

window.addEventListener('storage', (e) => {
  if (e.key === 'mindtwin_global_live_mode') {
    const isLive = e.newValue === 'true';
    if (liveMode !== isLive) {
      setLiveMode(isLive, false, true);
    }
  }
});

document.getElementById('timeFilter').addEventListener('change', () => {
  if (liveMode) renderLiveEvents(cachedEvents);
});

/* ═══════════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════════ */
const savedLiveMode = localStorage.getItem('mindtwin_global_live_mode');
if (savedLiveMode !== null) {
  liveModeToggle.checked = savedLiveMode === 'true';
}
setLiveMode(liveModeToggle.checked, false);
</script>
