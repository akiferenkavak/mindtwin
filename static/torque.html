<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Torque Anomaly Monitor</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    html,
    body {
      background: #111 !important;
      color: #eee !important;
      margin: 0;
      padding: 2rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    nav {
      background: #171616;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      padding: 1rem 2.5rem;
      border-radius: 12px;
    }

    nav .title {
      margin-right: auto;
      font-weight: 600;
      font-size: 1.1rem;
      color: #911212;
    }

    nav a {
      color: #945151;
      text-decoration: none;
      font-weight: 600;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      transition: background 0.2s ease, color 0.2s ease;
    }

    nav a:hover {
      background: rgba(71, 132, 230, 0.788);
      color: #fff;
    }

    #status {
      margin-top: 1rem;
      font-size: 1.05rem;
      letter-spacing: 0.2px;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: inline-block;
      min-width: 420px;
    }
  </style>
</head>

<body>
  <nav>
    <div class="title">MindTwin</div>
    <a href="/">Home</a>
    <a href="/thermal">Thermal</a>
    <a href="/torque">Torque</a>
    <a href="/events">Events</a>
    <a href="/autoencoder">Autoencoder</a>
  </nav>


  <h1>Torque Anomaly Monitor</h1>

  <canvas id="chart" width="700" height="350"></canvas>
  <div id="status">Starting…</div>

  <script>
    const SLIDE_WINDOW = 30;
    const JOINTS = 6;
    const TORQUE_THRESHOLD = 2.0;

    const ctx = document.getElementById("chart").getContext("2d");
    const statusDiv = document.getElementById("status");

    const JOINT_COLORS = [
      "#4da6ff", // Joint 1 - blue
      "#22c55e", // Joint 2 - green
      "#eab308", // Joint 3 - yellow
      "#f97316", // Joint 4 - orange
      "#ef4444", // Joint 5 - red
      "#a855f7"  // Joint 6 - purple
    ];

    const datasets = Array.from({ length: JOINTS }, (_, i) => ({
      label: `Joint ${i + 1}`,
      data: [],
      borderColor: JOINT_COLORS[i],
      backgroundColor: JOINT_COLORS[i],
      pointBackgroundColor: JOINT_COLORS[i],
      pointRadius: 3,
      borderWidth: 2,
      tension: 0.2
    }));

    // Model Datasets only (PCA & Autoencoder) — eski tek threshold kaldırıldı

    datasets.push({
      label: "PCA Score",
      data: [],
      borderColor: "#0ea5e9", // sky blue
      backgroundColor: "transparent",
      pointRadius: 2,
      borderWidth: 2,
      yAxisID: 'yModels'
    });
    datasets.push({
      label: "PCA Threshold",
      data: [],
      borderDash: [4, 4],
      borderColor: "#0ea5e9",
      borderWidth: 1,
      pointRadius: 0,
      yAxisID: 'yModels'
    });
    datasets.push({
      label: "AE Score",
      data: [],
      borderColor: "#d946ef", // fuchsia
      backgroundColor: "transparent",
      pointRadius: 2,
      borderWidth: 2,
      yAxisID: 'yModels'
    });
    datasets.push({
      label: "AE Threshold",
      data: [],
      borderDash: [4, 4],
      borderColor: "#d946ef",
      borderWidth: 1,
      pointRadius: 0,
      yAxisID: 'yModels'
    });

    const chart = new Chart(ctx, {
      type: "line",
      data: { datasets },
      options: {
        animation: false,
        scales: {
          x: { type: "linear", title: { display: true, text: "Frame #" } },
          y: { 
            title: { display: true, text: "Torque Diff" }, 
            suggestedMin: 0, suggestedMax: 1 
          },
          yModels: {
            position: 'right',
            title: { display: true, text: "Model Score (PCA/AE)" },
            grid: { drawOnChartArea: false }, // don't overlap grids
            suggestedMin: 0
          }
        },
        plugins: {
          legend: { labels: { color: "#ccc" } }
        }
      }
    });

    // ✅ IMPORTANT:
    // 8766 is RAW TCP for producer->consumer, NOT a browser WebSocket.
    // Browser must connect to FastAPI/Uvicorn websocket endpoint.
    const ws = new WebSocket("ws://127.0.0.1:8000/ws/torque");

    ws.onopen = () => {
      statusDiv.innerText = "Connected. Waiting for incoming sensor data…";
      statusDiv.style.color = "#ddd";
    };

    ws.onerror = () => {
      statusDiv.innerText = "WebSocket error. Check that backend is running.";
      statusDiv.style.color = "red";
    };

    ws.onclose = () => {
      statusDiv.innerText = "Disconnected. Backend not running / closed.";
      statusDiv.style.color = "red";
    };

    ws.onmessage = (event) => {
      const pkt = JSON.parse(event.data);

      // We expect pkt.diffs: array of length 6, pkt.frame_no, pkt.timestamp, pkt.anomaly (optional)
      if (Array.isArray(pkt.diffs)) {
        pkt.diffs.forEach((d, i) => {
          datasets[i].data.push({ x: pkt.frame_no, y: d });
          if (datasets[i].data.length > SLIDE_WINDOW) datasets[i].data.shift();
        });

        // PCA Score & Threshold (index: JOINTS, JOINTS+1)
        if (typeof pkt.pca_score === "number") {
          datasets[JOINTS].data.push({ x: pkt.frame_no, y: pkt.pca_score });
          datasets[JOINTS+1].data.push({ x: pkt.frame_no, y: pkt.pca_threshold });
        }
        if (datasets[JOINTS].data.length > SLIDE_WINDOW) datasets[JOINTS].data.shift();
        if (datasets[JOINTS+1].data.length > SLIDE_WINDOW) datasets[JOINTS+1].data.shift();

        // AE Score & Threshold (index: JOINTS+2, JOINTS+3)
        if (typeof pkt.ae_score === "number") {
          datasets[JOINTS+2].data.push({ x: pkt.frame_no, y: pkt.ae_score });
          datasets[JOINTS+3].data.push({ x: pkt.frame_no, y: pkt.ae_threshold });
        }
        if (datasets[JOINTS+2].data.length > SLIDE_WINDOW) datasets[JOINTS+2].data.shift();
        if (datasets[JOINTS+3].data.length > SLIDE_WINDOW) datasets[JOINTS+3].data.shift();

        // sliding x-axis
        chart.options.scales.x.min = Math.max(pkt.frame_no - SLIDE_WINDOW + 1, 0);
        chart.options.scales.x.max = pkt.frame_no;
        chart.update("none");
      }

      // ── Status panel ──────────────────────────────────────────
      const frame = pkt.frame_no ?? "-";
      const ts = pkt.timestamp
        ? pkt.timestamp.replace("T", " ").split(".")[0]
        : new Date().toLocaleTimeString();

      // PCA & AE live values
      const pcaScore = typeof pkt.pca_score    === "number" ? pkt.pca_score    : null;
      const pcaThr   = typeof pkt.pca_threshold === "number" ? pkt.pca_threshold : null;
      const pcaAnom  = !!pkt.pca_anomaly;

      const aeScore  = typeof pkt.ae_score    === "number" ? pkt.ae_score    : null;
      const aeThr    = typeof pkt.ae_threshold === "number" ? pkt.ae_threshold : null;
      const aeAnom   = !!pkt.ae_anomaly;

      const fmt2 = v => typeof v === "number" ? v.toFixed(2) : "—";
      const fmt4 = v => typeof v === "number" ? v.toFixed(4) : "—";

      // List ALL joints and their diff, flag those that cross a model threshold
      // We flag a joint as anomalous if PCA OR AE has fired (model-level anomaly)
      let jointLines = "";
      if (Array.isArray(pkt.diffs)) {
        const parts = pkt.diffs.map((d, i) => {
          const flag = (pcaAnom || aeAnom) && d === Math.max(...pkt.diffs) ? " ⚠️" : "";
          return `A${i+1}:${d.toFixed(3)}${flag}`;
        });
        jointLines = parts.join("  ");
      }

      // Model score lines with THEIR OWN thresholds (not 2.0)
      const pcaLine = pcaScore !== null
        ? `PCA  ${fmt4(pcaScore)} / threshold ${fmt4(pcaThr)}  →  ${pcaAnom ? "⚠️ ANOMALY" : "✅ Normal"}`
        : "PCA  —  (model not loaded)";

      const aeLine = aeScore !== null
        ? `AE   ${fmt4(aeScore)} / threshold ${fmt4(aeThr)}  →  ${aeAnom ? "⚠️ ANOMALY" : "✅ Normal"}`
        : "AE   —  (model not loaded)";

      // Headline
      let headline, color;
      if (pcaAnom && aeAnom) {
        headline = "🚨 DOUBLE ANOMALY — PCA + AUTOENCODER";
        color = "#ef4444";
      } else if (pcaAnom) {
        headline = "⚠️ PCA ANOMALY";
        color = "#f97316";
      } else if (aeAnom) {
        headline = "⚠️ AUTOENCODER ANOMALY";
        color = "#f97316";
      } else {
        headline = "✅ Normal";
        color = "#22c55e";
      }

      statusDiv.innerHTML =
        `<b style="font-size:1.05rem">${headline}</b><br>` +
        `<span style="font-family:monospace;font-size:0.88rem">${jointLines}</span><br>` +
        `<span style="font-family:monospace;font-size:0.85rem;opacity:0.85">` +
          `${pcaLine}<br>${aeLine}` +
        `</span><br>` +
        `<span style="opacity:0.5;font-size:0.8rem">Frame ${frame} | ${ts}</span>`;

      statusDiv.style.color = color;
      statusDiv.style.borderColor = (pcaAnom || aeAnom) ? color : "rgba(255,255,255,0.08)";
      statusDiv.style.fontWeight = (pcaAnom && aeAnom) ? "bold" : "normal";
    };


  </script>

</body>
<button id="chat-toggle"> KUKA AI</button>

<div id="chatbot" class="hidden">
  <div id="chat-header">
    MindTwin AI Assistant
  </div>

  <div id="chat-messages"></div>

  <div id="chat-input-area">
    <input id="chat-input" placeholder="Ask about anomalies..." />
    <button id="send-btn">Send</button>
  </div>
</div>

<style>
  #chat-toggle {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    background: #911212;
    color: white;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    z-index: 9999;
  }

  #chatbot {
    position: fixed;
    right: 20px;
    bottom: 100px;
    width: 340px;
    height: 420px;
    background: #181818;
    border: 1px solid #333;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    z-index: 9999;
  }

  .hidden {
    display: none !important;
  }

  #chat-header {
    padding: 1rem;
    background: #911212;
    font-weight: bold;
  }

  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 1rem;
    font-size: 0.95rem;
  }

  .msg-user {
    margin-bottom: 1rem;
    color: #7dd3fc;
  }

  .msg-ai {
    margin-bottom: 1rem;
    color: #c4f5c4;
  }

  #chat-input-area {
    display: flex;
    border-top: 1px solid #333;
  }

  #chat-input {
    flex: 1;
    background: #111;
    border: none;
    color: white;
    padding: 1rem;
    outline: none;
  }

  #send-btn {
    background: #911212;
    color: white;
    border: none;
    padding: 1rem;
    cursor: pointer;
  }
</style>

<script>
  const chatToggle = document.getElementById("chat-toggle");
  const chatbot = document.getElementById("chatbot");

  chatToggle.onclick = () => {
    chatbot.classList.toggle("hidden");
  };

  const chatMessages = document.getElementById("chat-messages");
  const chatInput = document.getElementById("chat-input");
  const sendBtn = document.getElementById("send-btn");

  async function sendMessage() {
    const message = chatInput.value.trim();

    if (!message) return;

    chatMessages.innerHTML += `
      <div class="msg-user">
        <b>You:</b> ${message}
      </div>
    `;

    chatInput.value = "";

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ message })
      });

      const data = await res.json();

      chatMessages.innerHTML += `
        <div class="msg-ai">
          <b>AI:</b> ${data.reply}
        </div>
      `;

      chatMessages.scrollTop = chatMessages.scrollHeight;

    } catch (err) {
      chatMessages.innerHTML += `
        <div class="msg-ai">
          <b>AI:</b> Backend connection error.
        </div>
      `;
    }
  }

  sendBtn.onclick = sendMessage;

  chatInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });
</script>

</html>
